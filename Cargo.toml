[package]
name = "live-serve"
version = "0.3.3"
edition = "2024"
description = "A tiny static dev server that reloads the page when files change; works from the CLI, VS Code and Zed"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NguyenTruong354/live-serve"
homepage = "https://github.com/NguyenTruong354/live-serve"
keywords = ["live-reload", "dev-server", "static", "http", "livereload"]
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]
exclude = ["/.github", "/docs", "/bench", "/editors"]

# `cargo binstall live-serve` downloads the release archive instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
notify = "8.2.0"
percent-encoding = "2.3.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
serde_json = "1.0.154"

