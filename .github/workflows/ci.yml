name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: linux-x64
          - os: macos-latest
            vscode: darwin-arm64
          - os: windows-latest
            vscode: win32-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The release's tag check, on the version as it stands: the crate, the extension and the
      # changelog agree on every push, not only on release day.
      - name: Versions agree
        if: runner.os == 'Linux'
        run: bash .github/scripts/check-tag.sh "v$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
      - uses: dtolnay/rust-toolchain@stable
      # The reload script's tests run it in Node.js; with CI set they fail rather than skip without it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          node scripts/package.mjs ${{ matrix.vscode }} ../../target/release/live-serve${{ matrix.exe }}

  # The release targets the test job does not build: static Linux binaries (musl) and Windows on Arm.
  release-targets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary is static and runs
        if: contains(matrix.target, 'musl')
        run: |
          bin=target/${{ matrix.target }}/release/live-serve
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" --version
