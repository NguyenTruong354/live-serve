name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: linux-x64
          - os: macos-latest
            vscode: darwin-arm64
          - os: windows-latest
            vscode: win32-x64
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The reload script's tests run it in Node.js; with CI set they fail rather than skip without it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          node scripts/package.mjs ${{ matrix.vscode }} ../../target/release/live-serve${{ matrix.exe }}
