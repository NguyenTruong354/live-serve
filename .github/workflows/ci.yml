name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The reload script's tests run it in Node.js; with CI set they fail rather than skip without it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo test --locked
      - run: cargo build --release --locked
